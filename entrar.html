<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Agentes Ti Artes</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
body { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.caixa { width: 100%; max-width: 420px; background: var(--folha); border: 1px solid var(--linha); border-radius: 18px; padding: 28px; display: grid; gap: 18px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); }
.marca img { width: 34px; height: 34px; display: block; }
.cupom-selo { margin: 0; padding: 10px 14px; border-radius: 12px; background: rgba(53, 224, 191, .12); border: 1px solid rgba(53, 224, 191, .35); color: inherit; font-size: 15px; line-height: 1.45; }
.cupom-selo[hidden] { display: none; }
.cupom-selo b { font-family: var(--mono, ui-monospace); letter-spacing: .06em; }
.marca b { font: 700 16px var(--serif); }
h1 { font-size: 30px; }
.abas { display: grid; grid-template-columns: 1fr 1fr; background: var(--papel); border-radius: 999px; padding: 4px; }
.abas button { min-height: 42px; border: 0; border-radius: 999px; background: transparent; font: 700 15px var(--sans); color: var(--grafite); cursor: pointer; }
.abas button[aria-pressed="true"] { background: var(--folha); color: var(--tinta); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
input { min-height: 48px; padding: 0 14px; border: 1.5px solid var(--linha); border-radius: 12px; background: var(--folha); color: var(--tinta); font: 400 16px var(--sans); }
input:focus { border-color: var(--teal); outline: none; }
.aceite { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; color: var(--grafite); }
.aceite input { width: 22px; height: 22px; min-height: 0; margin: 1px 0 0; accent-color: var(--teal); flex: none; }
.g-caixa { display: grid; gap: 14px; }
.g-caixa[hidden] { display: none; }
.g-bt { width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; border: 1px solid #747775;
  background: #fff; color: #1f1f1f; font: 700 16px var(--sans); cursor: pointer; }
.g-bt:hover { background: #f2f2f2; }
.g-bt:disabled { opacity: .6; cursor: progress; }
.g-bt svg { width: 20px; height: 20px; flex: none; }
.ou { display: flex; align-items: center; gap: 12px; color: var(--grafite); font-size: 14px; }
.ou::before, .ou::after { content: ''; flex: 1; height: 1px; background: var(--linha); }
.erro { background: var(--erro-fundo); color: var(--erro); padding: 10px 14px; border-radius: 10px; font-size: 15px; }
</style>
</head>
<body>
<main class="caixa">
  <a class="marca" href="index.html"><img src="logo.svg" alt="" width="34" height="34"><b>Agentes Ti Artes</b></a>
  <p class="cupom-selo" id="cupom-selo" hidden></p>
  <h1 id="titulo">Crie a sua conta</h1>
  <div id="g-caixa" class="g-caixa" hidden>
    <button type="button" class="g-bt" id="g-bt"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continuar com Google</button>
    <p class="ou">ou com e-mail e senha</p>
  </div>
  <div class="abas" role="group" aria-label="Criar conta ou entrar">
    <button type="button" id="aba-criar" aria-pressed="true">Criar conta</button>
    <button type="button" id="aba-entrar" aria-pressed="false">Já tenho conta</button>
  </div>
  <form id="form" novalidate>
    <label id="l-nome">Seu nome<input id="nome" autocomplete="name" placeholder="Rosa Lima"></label>
    <label id="l-negocio">Nome do negócio<input id="negocio" autocomplete="organization" placeholder="Ateliê Folha Miúda"></label>
    <label>E-mail<input id="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@seunegocio.com.br"></label>
    <label>Senha<input id="senha" type="password" autocomplete="new-password" placeholder="pelo menos 8 letras ou números"></label>
    <label class="aceite" id="l-aceite"><input id="aceite" type="checkbox" checked> Pode me escrever por e-mail sobre o meu teste e o meu agente.</label>
    <p class="erro" id="erro" hidden></p>
    <button class="bt" id="enviar" type="submit">Criar e começar</button>
    <p class="dica" id="dica">Sem cartão. Você ganha 4 horas para alimentar o agente com o que já tem (cardápio em PDF, fotos, prints, o seu site), testar e ver ele respondendo no seu Instagram. Depois escolhe se assina.</p>
  </form>
</main>
<script src="config.js"></script>
<script src="sessao.js"></script>
<script>
const q = new URLSearchParams(location.search);
let criando = q.get('criar') === '1' || !q.has('entrar');
const $ = (id) => document.getElementById(id);
function modo(criar) {
  criando = criar;
  $('aba-criar').setAttribute('aria-pressed', String(criar)); $('aba-entrar').setAttribute('aria-pressed', String(!criar));
  $('l-nome').hidden = !criar; $('l-negocio').hidden = !criar; $('dica').hidden = !criar; $('l-aceite').hidden = !criar;
  $('titulo').textContent = criar ? 'Crie a sua conta' : 'Entre na sua conta';
  $('enviar').textContent = criar ? 'Criar e começar' : 'Entrar';
  $('senha').autocomplete = criar ? 'new-password' : 'current-password';
  $('erro').hidden = true;
}
$('aba-criar').onclick = () => modo(true);
$('aba-entrar').onclick = () => modo(false);
modo(criando);
/* o cupom dos chegados (entrar.html?cupom=CODIGO): fica guardado até a conta existir; o painel aplica (uma vez) */
const cupom = (q.get('cupom') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 30);
if (cupom) { try { localStorage.setItem('robo-cupom', cupom); } catch (_) { /* sem armazenamento: vale pelo e-mail */ } }
const cupomAgora = cupom || (() => { try { return localStorage.getItem('robo-cupom') || ''; } catch (_) { return ''; } })();
if (cupomAgora) { $('cupom-selo').innerHTML = `Cupom <b>${cupomAgora.replace(/[<>&]/g, '')}</b>: o seu teste grátis fica maior. Vale assim que a conta for criada.`; $('cupom-selo').hidden = false; }
const vaiPainel = (plano) => { location.href = 'painel.html' + (plano ? '?plano=' + encodeURIComponent(plano) : ''); };
if (Sessao.tem() && !q.has('criar') && !/google/.test(location.hash)) vaiPainel(q.get('plano'));

/* Entrar com Google: um clique, sem senha. Conta nova escolhe o nome do negócio no painel. */
(async () => {
  const v = await Sessao.voltaDoGoogle();
  if (v && v.ok) return vaiPainel(v.plano);
  if (v && v.erro) { $('erro').textContent = v.erro; $('erro').hidden = false; }
  try { const p = await (await fetch(ROBO.funcao + '/planos')).json(); if (p.entrar_google) $('g-caixa').hidden = false; } catch (_) { /* sem o botão, fica o e-mail */ }
})();
$('g-bt').onclick = async () => {
  $('g-bt').disabled = true;
  try { await Sessao.google({ plano: q.get('plano') || '' }); }
  catch (e) { $('g-bt').disabled = false; $('erro').textContent = e.message; $('erro').hidden = false; }
};

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('email').value.trim().toLowerCase(), senha = $('senha').value;
  const nome = $('nome').value.trim(), negocio = $('negocio').value.trim();
  const erro = (m) => { $('erro').textContent = m; $('erro').hidden = false; $('enviar').disabled = false; };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return erro('Confira o e-mail.');
  if (senha.length < 8) return erro('A senha precisa ter pelo menos 8 letras ou números.');
  if (criando && negocio.length < 2) return erro('Qual é o nome do seu negócio?');
  $('enviar').disabled = true; $('erro').hidden = true;
  try {
    if (criando) {
      const r = await fetch(ROBO.funcao + '/cadastro', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, senha, nome }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return erro(j.erro || 'Não deu para criar a conta agora.');
    }
    await Sessao.entrar(email, senha);
    if (criando) {
      const c = await Sessao.api('/comecar', { negocio, nome, aceita_contato: $('aceite').checked, cupom: cupomAgora || undefined });
      if (cupomAgora && (c.teste && c.teste.cupom || c.aviso_cupom)) { try { localStorage.removeItem('robo-cupom'); } catch (_) { /* tudo bem */ } }
      if (c.erro) return erro(c.erro);
    }
    location.href = 'painel.html' + (q.get('plano') ? '?plano=' + encodeURIComponent(q.get('plano')) : '');
  } catch (e) { if (e.message !== 'login') erro(e.message || 'Algo deu errado. Tente de novo.'); }
});
</script>
</body>
</html>
