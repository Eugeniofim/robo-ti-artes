<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · Agentes Ti Artes</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="color-scheme" content="dark light">
<script>
  /* o tema nasce antes de pintar (sem piscar): escuro, a não ser que a pessoa tenha desligado o "Modo noite" */
  try { if (localStorage.getItem('robo-painel-menu:noite') === '0') document.documentElement.dataset.theme = 'light'; } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
/* =====================================================================
   O PAINEL (15/11/2026, refeito): menu lateral de vidro + área de cartões de vidro sobre um fundo com brilho teal.
   Tudo usa os tokens de estilo.css (claro e escuro); o painel nasce no escuro.
   ===================================================================== */
html { background: var(--papel); }
body { min-height: 100dvh; font-size: 16.5px; background: transparent; }
:root { --card: color-mix(in srgb, var(--folha) 66%, transparent); --card-borda: color-mix(in srgb, var(--linha) 80%, transparent);
  --menta: linear-gradient(180deg, #46E8C9, #16A894); --menta-texto: #03201B; --raio-g: 24px; }

/* o fundo: brilho teal que deriva devagar + uma grade de pontos que some para baixo (é o que o vidro desfoca) */
.fundo { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--papel); }
.fundo::before { content: ''; position: absolute; inset: -20%;
  background: radial-gradient(38% 34% at 14% 10%, color-mix(in srgb, var(--teal) 36%, transparent), transparent 70%),
    radial-gradient(28% 28% at 90% 6%, color-mix(in srgb, var(--sinal) 20%, transparent), transparent 70%),
    radial-gradient(44% 40% at 72% 104%, color-mix(in srgb, var(--teal) 20%, transparent), transparent 70%);
  animation: deriva 38s ease-in-out infinite alternate; }
.fundo::after { content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(color-mix(in srgb, var(--tinta) 10%, transparent) 1px, transparent 1.3px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 40% 0%, #000, transparent 78%); mask-image: radial-gradient(ellipse 90% 70% at 40% 0%, #000, transparent 78%); }
@keyframes deriva { to { transform: translate3d(3%, 2%, 0) scale(1.06); } }

/* ==== MENU LATERAL DE VIDRO (skill menu-lateral-vidro, com os tokens da Ti Artes) ==== */
.gs {
  --gs-largura: 268px; --gs-rail: 78px; --gs-canto: 30px;
  --gs-vidro: rgba(5, 22, 24, .56);
  --gs-borda: rgba(255, 255, 255, .16);
  --gs-texto: #fff; --gs-fraco: rgba(255, 255, 255, .76);
  --gs-destaque: #18B09C; --gs-ok: #35E0BF;
  --gs-mola: cubic-bezier(.22, 1, .36, 1);
  --gs-fonte: var(--sans);
  position: relative; display: flex; flex-direction: column; box-sizing: border-box;
  width: var(--gs-largura); max-height: 100%; padding: 14px;
  color: var(--gs-texto); font: 500 16px/1.2 var(--gs-fonte);
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02) 30%), var(--gs-vidro);
  -webkit-backdrop-filter: blur(24px) saturate(150%) brightness(.84);
  backdrop-filter: blur(24px) saturate(150%) brightness(.84);
  border: 1px solid var(--gs-borda); border-radius: var(--gs-canto);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 30px 70px -24px rgba(0,0,0,.6);
  transition: width .34s var(--gs-mola);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .gs { background: rgba(8, 26, 28, .96); } }
.gs *, .gs *::before, .gs *::after { box-sizing: border-box; }
.gs[data-noite="1"] { --gs-vidro: rgba(4, 14, 16, .64); }
.gs button, .gs a, .gs input { font: inherit; color: inherit; }
:where(.gs button) { background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
.gs a { text-decoration: none; }
.gs :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.gs svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.gs-topo { display: flex; align-items: center; gap: 12px; padding: 4px 6px 12px; min-height: 58px; }
.gs-logo { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; color: var(--menta-texto); font: 700 20px var(--serif);
  background: radial-gradient(circle at 32% 26%, #7DF5DC, #18B09C 58%, #0A6E62); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 18px -6px rgba(53,224,191,.55); overflow: hidden; }
.gs-logo img { width: 100%; height: 100%; object-fit: cover; }
.gs-logo:has(img) { background: #0B1D1C; border: 1px solid rgba(46, 220, 198, .25); padding: 5px; }
.gs-marca { min-width: 0; display: grid; gap: 3px; white-space: nowrap; overflow: hidden; }
.gs-marca b { font: 700 18px var(--serif); overflow: hidden; text-overflow: ellipsis; }
.gs-marca small { font-size: 13px; color: var(--gs-fraco); font-weight: 400; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); letter-spacing: .02em; }
.gs .gs-recolher { position: absolute; top: 24px; right: -18px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #0B1416; box-shadow: 0 6px 18px rgba(0,0,0,.34); transition: transform .2s var(--gs-mola); }
.gs .gs-recolher::after { content: ""; position: absolute; inset: -5px; }
.gs .gs-recolher:hover { transform: scale(1.08); }
.gs-recolher svg { width: 15px; height: 15px; stroke-width: 2.6; transition: transform .34s var(--gs-mola); }
.gs[data-recolhido="1"] .gs-recolher svg { transform: rotate(180deg); }
.gs-busca { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 10px 0 14px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.gs .gs-busca-ic { display: grid; place-items: center; color: var(--gs-fraco); min-width: 24px; min-height: 44px; }
.gs-busca input { flex: 1; min-width: 0; width: 100%; height: 100%; background: none; border: 0; outline: 0; font-size: 16px; }
.gs-busca input::placeholder { color: var(--gs-fraco); opacity: 1; }
.gs-busca kbd { font: 500 12px var(--gs-fonte); padding: 4px 7px; border-radius: 7px; background: rgba(255,255,255,.14); color: var(--gs-fraco); white-space: nowrap; }
.gs-nav { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: 4px; scrollbar-width: none; }
.gs-nav::-webkit-scrollbar { display: none; }
.gs-pilula, .gs-rastro { position: absolute; left: 0; top: 0; border-radius: 999px; pointer-events: none; opacity: 0; will-change: transform; }
.gs-pilula { z-index: 1; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.07)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.26); transition: transform .24s var(--gs-mola), width .24s var(--gs-mola), height .24s var(--gs-mola), opacity .16s; }
.gs-rastro { z-index: 0; background: rgba(255,255,255,.1); transition: transform .5s var(--gs-mola), width .5s var(--gs-mola), height .5s var(--gs-mola), opacity .3s; }
.gs-secao { position: relative; z-index: 2; display: block; height: 34px; padding: 15px 14px 0; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gs-fraco); white-space: nowrap; overflow: hidden; transition: height .3s var(--gs-mola); }
.gs-item { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; width: 100%; height: 48px; padding: 0 14px; border-radius: 999px; white-space: nowrap; }
.gs-item[aria-current="page"] svg { color: #7DF5DC; }
.gs-rot { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; transition: opacity .18s; }
/* o mouse em cima só clareia o item; a pílula fica na aba aberta (16/11: ela seguir o mouse parecia defeito) */
@media (hover: hover) {
  .gs-item { transition: background-color .16s; }
  .gs-item:not([aria-current]):hover { background: rgba(255,255,255,.07); }
}
/* tela baixa (notebook pequeno, celular): aperta um pouco para o Conectar não sumir lá embaixo; nada abaixo de 44 px de toque */
@media (max-height: 900px) {
  .gs-item, .gs-noite { height: 44px; }
  .gs-secao { height: 30px; padding-top: 12px; }
}
.gs-selo { flex: none; min-width: 24px; height: 24px; padding: 0 7px; display: grid; place-items: center; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: rgba(255,255,255,.2); }
.gs-selo.alerta { background: #F0B95A; color: #241700; }
.gs-selo.ponto { min-width: 9px; width: 9px; height: 9px; padding: 0; background: #F0B95A; margin-right: 8px; box-shadow: 0 0 10px #F0B95A; }
.gs-seta { width: 15px !important; height: 15px !important; color: var(--gs-fraco); transition: transform .3s var(--gs-mola); }
.gs-noite { display: flex; align-items: center; gap: 14px; width: 100%; height: 48px; padding: 0 14px; margin-top: 8px; border-radius: 999px; white-space: nowrap; }
.gs-chave { width: 46px; height: 26px; flex: none; border-radius: 999px; padding: 3px; background: rgba(255,255,255,.26); transition: background .2s; }
.gs-chave i { display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.3); transition: transform .24s var(--gs-mola); }
.gs-noite[aria-checked="true"] .gs-chave { background: var(--gs-destaque); }
.gs-noite[aria-checked="true"] .gs-chave i { transform: translateX(20px); }
.gs-usuario { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 6px; padding: 12px 8px 4px; border-top: 1px solid rgba(255,255,255,.18) !important; white-space: nowrap; min-height: 56px; }
.gs-avatar { position: relative; width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: rgba(255,255,255,.22); }
.gs-avatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--gs-ok); border: 2px solid rgba(8,26,28,.9); }
.gs-quem { flex: 1; min-width: 0; display: grid; gap: 3px; overflow: hidden; }
.gs-quem b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.gs-quem small { font-size: 13px; color: var(--gs-fraco); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.gs[data-recolhido="1"] { width: var(--gs-rail); padding: 14px 10px; border-radius: calc(var(--gs-rail) / 2); }
.gs[data-recolhido="1"] .gs-marca, .gs[data-recolhido="1"] .gs-rot, .gs[data-recolhido="1"] .gs-busca input, .gs[data-recolhido="1"] .gs-busca kbd,
.gs[data-recolhido="1"] .gs-seta, .gs[data-recolhido="1"] .gs-chave, .gs[data-recolhido="1"] .gs-quem, .gs[data-recolhido="1"] .gs-usuario > svg { display: none; }
.gs[data-recolhido="1"] .gs-topo { justify-content: center; padding: 2px 0 10px; }
.gs[data-recolhido="1"] .gs-recolher { top: 18px; right: -22px; }
.gs[data-recolhido="1"] .gs-busca { justify-content: center; padding: 0; background: none; box-shadow: none; }
.gs[data-recolhido="1"] .gs-busca-ic { color: #fff; }
.gs[data-recolhido="1"] .gs-secao { height: 19px; padding: 9px 0 0; color: transparent; }
.gs[data-recolhido="1"] .gs-secao::after { content: ""; display: block; width: 22px; height: 2px; margin: -8px auto 0; border-radius: 2px; background: rgba(255,255,255,.34); }
.gs[data-recolhido="1"] .gs-item, .gs[data-recolhido="1"] .gs-noite { justify-content: center; padding: 0; width: 48px; margin-inline: auto; }
.gs[data-recolhido="1"] .gs-selo { position: absolute; top: 8px; right: 7px; min-width: 11px; width: 11px; height: 11px; padding: 0; font-size: 0; margin: 0; background: #F0B95A; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
.gs[data-recolhido="1"] .gs-usuario { justify-content: center; padding: 10px 0 2px; }
/* o balão: vidro escuro como o menu, com a setinha apontando o item; quem cuida da aba vem na cor do agente */
.gs-dica { position: fixed; z-index: 60; display: grid; gap: 5px; padding: 8px 12px 8px 9px; border-radius: 12px; font: 500 13.5px/1.3 var(--sans); color: #E8F3F1;
  background: rgba(8, 20, 22, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 10px 26px rgba(0,0,0,.34);
  pointer-events: none; opacity: 0; transform: translateX(-6px); transition: opacity .14s, transform .18s; white-space: nowrap; }
.gs-dica::before { content: ""; position: absolute; left: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; transform: rotate(45deg); background: rgba(8, 20, 22, .92); box-shadow: -1px 1px 0 rgba(255,255,255,.12); }
.gs-dica.on { opacity: 1; transform: none; }
.gs-dica-rot { padding-left: 3px; font-weight: 650; font-size: 14px; color: #fff; }
.gs-dica-quem { display: flex; align-items: center; gap: 8px; }
.gs-dica-quem b { font-weight: 650; }
.gs-dica-quem b.sol { color: #7DF5DC; }
.gs-dica-quem b.dora { color: #FFB06B; }
.gs-dica .mini-av { width: 21px; height: 21px; font-size: 11.5px; }
.gs-dica .mini-av + .mini-av { margin-left: -6px; box-shadow: 0 0 0 2px rgb(8, 20, 22); }
@media (prefers-reduced-motion: reduce) { .gs, .gs *, .gs-dica { transition-duration: .01ms !important; } }
/* ==== FIM DO MENU ==== */

/* ---------- a casca: menu à esquerda, área à direita ---------- */
.casca { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; max-width: 1500px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) var(--gut-r) 24px var(--gut-l); }
.lado { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); height: calc(100dvh - 32px); z-index: 30; }
.lado .gs { height: 100%; }
.area { min-width: 0; display: grid; align-content: start; gap: 22px; }
.barra { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 22px; border-radius: 22px; min-height: 64px; }
.barra-tit { min-width: 0; flex: 1; display: grid; gap: 2px; }
.barra-tit small { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cinza); }
.barra-tit b { font: 700 20px/1.15 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra .selo { min-height: 32px; text-decoration: none; }
.bt-menu { display: none; }
.local { border-radius: 14px; }

main#conteudo { min-width: 0; padding-bottom: 40px; }
.aba { display: grid; gap: 22px; animation: entra .38s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } }
.aba h1 { font-size: clamp(28px, 3.3vw, 40px); }
.aba h2 { font-size: 21px; }
.lede { color: var(--grafite); max-width: 46em; font-size: 17px; }
.cabeca-aba { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cabeca-aba > div { display: grid; gap: 8px; min-width: 0; }

/* cartões de vidro */
.cartao { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--raio-g); padding: 22px; display: grid; gap: 14px; min-width: 0;
  box-shadow: var(--vidro-luz), 0 24px 60px -34px rgba(0, 0, 0, .6); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); }
.cartao.leve { box-shadow: var(--vidro-luz); }
.cartao h2 { display: flex; align-items: center; gap: 10px; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grade3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

/* botões: o principal é menta com texto escuro (contraste alto nos dois temas) */
.bt { background: var(--menta); color: var(--menta-texto); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 26px -14px rgba(53,224,191,.7); }
.bt:hover { background: linear-gradient(180deg, #5BF0D3, #1BB8A2); border-color: transparent; transform: translateY(-1px); }
.bt.fraco { background: color-mix(in srgb, var(--folha) 40%, transparent); color: var(--tinta); border: 1px solid var(--card-borda); box-shadow: var(--vidro-luz); }
.bt.fraco:hover { border-color: color-mix(in srgb, var(--sinal) 55%, transparent); background: color-mix(in srgb, var(--teal) 14%, transparent); }
.bt.perigo { background: var(--erro-fundo); color: var(--erro); box-shadow: none; }
.bt svg, .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.bt[disabled] { cursor: not-allowed; transform: none; }
.lnk { background: none; border: 0; color: var(--teal); font: 700 15px var(--sans); cursor: pointer; min-height: 44px; padding: 0 6px; text-decoration: underline; text-underline-offset: 3px; }
.selo.ok { background: color-mix(in srgb, var(--teal) 18%, transparent); }
.aviso { padding: 14px 16px; border-radius: 16px; font-size: 15.5px; display: flex; gap: 12px; align-items: flex-start; border: 1px solid transparent; }
.aviso .ic { margin-top: 2px; }
.aviso.atencao { background: var(--ambar-fundo); color: var(--tinta); border-color: color-mix(in srgb, var(--ambar) 30%, transparent); }
.aviso.erro { background: var(--erro-fundo); color: var(--erro); }
.aviso.info { background: color-mix(in srgb, var(--teal) 14%, transparent); color: var(--tinta); border-color: color-mix(in srgb, var(--sinal) 25%, transparent); }
.aviso a { font-weight: 700; }
.ic { display: inline-grid; place-items: center; flex: none; }

/* o anel do cérebro */
.anel { position: relative; width: var(--tam, 168px); aspect-ratio: 1; flex: none; display: grid; place-items: center; text-decoration: none; color: var(--tinta); }
.anel svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.anel circle { fill: none; stroke-width: 9; }
.anel .trilha { stroke: color-mix(in srgb, var(--tinta) 10%, transparent); }
.anel .valor { stroke: var(--sinal); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.1s cubic-bezier(.22, 1, .36, 1); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--sinal) 70%, transparent)); }
.anel-txt { display: grid; justify-items: center; line-height: 1; gap: 6px; }
.anel-txt b { font: 700 calc(var(--tam, 168px) * .26) var(--serif); font-variant-numeric: tabular-nums; }
.anel-txt span { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cinza); }

/* Início */
.heroi { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 28px; padding: 30px 32px; overflow: hidden; position: relative; }
.heroi::before { content: ''; position: absolute; right: -80px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--sinal) 22%, transparent), transparent 65%); pointer-events: none; }
.heroi-txt { display: grid; gap: 12px; position: relative; }
.heroi-acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.passos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: p; }
.passos li a { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 18px; text-decoration: none; color: var(--tinta); background: var(--card); border: 1px solid var(--card-borda); font-weight: 700; font-size: 15px; line-height: 1.25; transition: border-color .2s, transform .2s; }
.passos li a:hover { border-color: color-mix(in srgb, var(--sinal) 50%, transparent); transform: translateY(-1px); }
.passos .bola { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 13px var(--mono); border: 2px solid var(--card-borda); color: var(--cinza); }
.passos li.feito .bola { background: var(--menta); border-color: transparent; color: var(--menta-texto); }
.passos li.feito a { color: var(--grafite); }
.passos li.agora a { border-color: color-mix(in srgb, var(--sinal) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 12%, transparent); }
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; }
.bento > * { grid-column: span 2; }
.bento > .largo { grid-column: span 3; }
.tile h2 { font-size: 19px; }
.tile .vazio { color: var(--cinza); }
.mini-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mini-lista li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--card-borda); }
.mini-lista li:last-child { border-bottom: 0; }
.mini-lista .quando { font: 600 13px var(--mono); color: var(--teal); white-space: nowrap; }
.mini-lista b { display: block; overflow: hidden; text-overflow: ellipsis; }
.mini-lista span.dica { display: block; }

/* Cérebro */
.cerebro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 22px; align-items: start; }
.cerebro-col { display: grid; gap: 22px; min-width: 0; }
.cerebro-lado { position: sticky; top: 100px; display: grid; gap: 16px; }
.boas-vindas { background: radial-gradient(120% 120% at 0% 0%, color-mix(in srgb, var(--teal) 30%, transparent), transparent 60%), var(--card); }
.tres { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tres li { display: grid; gap: 6px; padding: 14px; border-radius: 18px; background: color-mix(in srgb, var(--folha) 50%, transparent); border: 1px solid var(--card-borda); font-size: 15px; }
.tres b { font-size: 16px; }
.tres .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--menta); color: var(--menta-texto); font: 700 13px var(--mono); }
.solta { position: relative; border-radius: var(--raio-g); padding: 34px 22px 28px; text-align: center; display: grid; justify-items: center; gap: 10px; cursor: pointer;
  border: 1.5px dashed color-mix(in srgb, var(--sinal) 50%, transparent);
  background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--teal) 22%, transparent), transparent 70%), var(--card);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); transition: border-color .2s, transform .2s, box-shadow .2s; }
.solta:hover { border-color: color-mix(in srgb, var(--sinal) 80%, transparent); }
.solta.em-cima { border-color: var(--sinal); border-style: solid; transform: scale(1.01); box-shadow: 0 0 0 6px color-mix(in srgb, var(--sinal) 16%, transparent), 0 24px 60px -22px color-mix(in srgb, var(--sinal) 55%, transparent); }
.solta h2 { font-size: clamp(20px, 2.3vw, 26px); max-width: 26em; }
.solta p { color: var(--grafite); max-width: 36em; }
.solta .bt { margin-top: 6px; }
.solta.compacta { padding: 22px 18px; }
.ic-grande { width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center; color: #E9FFF9;
  background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.03)), color-mix(in srgb, var(--teal) 70%, #031a17);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 16px 34px -14px color-mix(in srgb, var(--sinal) 70%, transparent); }
.ic-grande svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.solta.em-cima .ic-grande { animation: pula .8s ease-in-out infinite alternate; }
@keyframes pula { to { transform: translateY(-6px); } }
.tipos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tipos span { font: 600 12px var(--mono); letter-spacing: .06em; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 8%, transparent); color: var(--grafite); }
.campo { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
/* os avisos da Dora (cartão da secretária) */
.avisos-dora { margin: 16px 0 4px; padding: 14px 16px; border: 1px solid var(--card-borda); border-radius: 14px; display: grid; gap: 10px; }
.avisos-dora h3 { margin: 0; font-size: 16px; }
.av-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; }
.av-linha input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--sinal); flex: none; }
.av-linha input[type=time], .av-linha select { min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--card-borda); border-radius: 10px; font: 400 15px var(--sans); background: transparent; color: inherit; }
.campo input, .campo textarea, .entrada { width: 100%; min-height: 48px; padding: 12px 14px; border: 1.5px solid var(--card-borda); border-radius: 14px; font: 400 16px/1.45 var(--sans);
  background: color-mix(in srgb, var(--folha) 70%, transparent); color: var(--tinta); }
.campo input:focus, .campo textarea:focus, .entrada:focus { border-color: var(--sinal); outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 16%, transparent); }
.linha-campo { display: flex; gap: 8px; align-items: stretch; }
.linha-campo .entrada { flex: 1; min-width: 0; }
.fila, .fontes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fila:empty { display: none; }
.item-f { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--folha) 55%, transparent); border: 1px solid var(--card-borda); }
.item-f.novo { animation: brilha 2.4s ease-out 1; }
@keyframes brilha { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sinal) 60%, transparent); border-color: var(--sinal); } 100% { box-shadow: 0 0 0 14px transparent; } }
.item-f .meio { min-width: 0; display: grid; gap: 3px; }
.item-f .meio b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-f .acoes { display: flex; gap: 4px; align-items: center; }
.item-f.erro { border-color: color-mix(in srgb, var(--erro) 45%, transparent); }
.tipo-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 700 11px var(--mono); letter-spacing: .04em; color: #fff; }
.tipo-ic svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tipo-ic.pdf { background: linear-gradient(160deg, #F07167, #B23A31); }
.tipo-ic.foto { background: linear-gradient(160deg, #A78BFA, #6D4BD1); }
.tipo-ic.site { background: linear-gradient(160deg, #4FB3F6, #1F6FB0); }
.tipo-ic.texto { background: linear-gradient(160deg, #F4C062, #B07D17); color: #2A1A00; }
.tipo-ic.outro { background: linear-gradient(160deg, #7C8E92, #46585C); }
.tipo-ic.insta { background: linear-gradient(135deg, #F7B74A, #E1306C 55%, #8A3AB9); }
.insta-c { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
@media (max-width: 860px) { .insta-c { grid-template-columns: minmax(0, 1fr); } }
.prog { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 10%, transparent); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--menta); transition: width .2s; }
.prog.lendo i { width: 40% !important; animation: varre 1.2s ease-in-out infinite; }
@keyframes varre { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.aprendeu { color: var(--teal); font-weight: 700; font-size: 14.5px; }
.bt-ic { min-width: 44px; min-height: 44px; border-radius: 14px; border: 0; background: transparent; color: var(--grafite); cursor: pointer; display: grid; place-items: center; }
.bt-ic:hover { background: color-mix(in srgb, var(--tinta) 8%, transparent); color: var(--tinta); }
.bt-ic.certeza { background: var(--erro-fundo); color: var(--erro); font: 700 13px var(--sans); padding: 0 12px; }
.bt-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ck { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: color-mix(in srgb, var(--folha) 45%, transparent); border: 1px solid var(--card-borda); }
.ck .marca { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px dashed var(--card-borda); color: var(--cinza); }
.ck .marca svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ck.ok .marca { background: var(--menta); border: 0; color: var(--menta-texto); }
.ck.meio .marca { border: 2px solid var(--ambar); color: var(--ambar); }
.ck .meio-t { display: grid; gap: 2px; min-width: 0; }
.ck .meio-t span { font-size: 14.5px; color: var(--grafite); }
.pers { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.per { text-align: left; display: grid; gap: 8px; padding: 14px; border-radius: 18px; border: 1.5px solid var(--card-borda); background: color-mix(in srgb, var(--folha) 45%, transparent); cursor: pointer; color: var(--tinta); font: 400 15px/1.4 var(--sans); transition: border-color .2s, transform .2s; }
.per:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--sinal) 45%, transparent); }
.per b { font: 700 17px var(--serif); }
.per[aria-pressed="true"] { border-color: var(--sinal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 14%, transparent); }
.per[aria-pressed="true"] b::after { content: '  ✓'; color: var(--teal); }
.bolha-ex { padding: 10px 12px; border-radius: 14px 14px 14px 4px; background: color-mix(in srgb, var(--tinta) 7%, transparent); color: var(--grafite); font-size: 14.5px; }
.bolha-ex.vazia { font-style: italic; }
.meu-jeito { display: grid; gap: 8px; margin-top: 10px; }
details.dobra > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 700 18px var(--serif); min-height: 44px; }
details.dobra > summary::-webkit-details-marker { display: none; }
details.dobra > summary::after { content: '+'; font: 600 22px var(--mono); color: var(--teal); }
details.dobra[open] > summary::after { content: '–'; }
.sabe { display: grid; gap: 16px; }
.sabe h3 { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--cinza); margin-bottom: 4px; }
.sabe .vazio { color: var(--cinza); font-style: italic; }
.servicos { display: grid; gap: 6px; }
.servicos div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--card-borda); padding-bottom: 6px; }
.servicos span:last-child { font-family: var(--mono); font-size: 14px; white-space: nowrap; }

/* conversa (treinar e testar) */
.chat { background: var(--card); border: 1px solid var(--card-borda); border-radius: var(--raio-g); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: min(74vh, 700px); min-height: 420px; overflow: hidden;
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); box-shadow: var(--vidro-luz), 0 24px 60px -34px rgba(0,0,0,.6); }
.chat-topo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--card-borda); background: color-mix(in srgb, var(--folha) 35%, transparent); }
.avatar-robo { position: relative; width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 18px var(--serif); color: var(--menta-texto); background: radial-gradient(circle at 32% 26%, #9AF7E4, #18B09C 60%, #0A6E62); box-shadow: 0 6px 16px -6px rgba(53,224,191,.6); }
.avatar-robo.dora { color: #3A1602; background: radial-gradient(circle at 32% 26%, #FFD2AE, #FF8A3D 60%, #C2531A); box-shadow: 0 6px 16px -6px rgba(255,138,61,.6); }
.avatar-robo::after { content: ''; position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--sinal); border: 2px solid var(--folha); }
.chat-topo div { display: grid; gap: 1px; min-width: 0; }
.chat-topo span { font-size: 13.5px; color: var(--cinza); }
.msgs { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.m { max-width: 88%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5; animation: entra .25s ease-out both; }
.m.eu { align-self: flex-end; background: var(--menta); color: var(--menta-texto); border-bottom-right-radius: 6px; }
.m.ele { align-self: flex-start; background: color-mix(in srgb, var(--folha) 80%, transparent); border: 1px solid var(--card-borda); border-bottom-left-radius: 6px; }
.m .feito { display: flex; align-items: center; gap: 6px; margin-top: 8px; font: 600 12px var(--mono); color: var(--teal); }
.m .feito::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--sinal); box-shadow: 0 0 8px var(--sinal); }
/* link dentro da mensagem (16/11): clicável, quebra se for comprido */
.m .lnk-msg { color: inherit; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.m.ele .lnk-msg { color: var(--teal-forte, var(--teal)); }
.m .convite { display: inline-flex; margin-top: 10px; }
.m.pensando { display: inline-flex; align-items: center; gap: 10px; color: var(--cinza); }
/* 17/11: o dono assumiu a conversa na ficha: o agente não responde (aviso no meio da conversa) */
.m.sistema { align-self: center; max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 14px; text-align: center; color: var(--cinza);
  background: color-mix(in srgb, var(--cinza) 10%, transparent); border: 1px dashed color-mix(in srgb, var(--cinza) 40%, transparent); }
.pontos { display: inline-flex; gap: 4px; }
.pontos i { width: 7px; height: 7px; border-radius: 50%; background: var(--sinal); animation: digita 1.1s ease-in-out infinite; }
.pontos i:nth-child(2) { animation-delay: .15s; } .pontos i:nth-child(3) { animation-delay: .3s; }
@keyframes digita { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
.escrever { border-top: 1px solid var(--card-borda); padding: 12px; display: grid; gap: 10px; background: color-mix(in srgb, var(--folha) 30%, transparent); }
.escrever .linha { display: flex; gap: 8px; align-items: flex-end; }
.escrever textarea { flex: 1; min-width: 0; min-height: 48px; max-height: 180px; resize: none; padding: 12px 14px; border: 1.5px solid var(--card-borda); border-radius: 16px; font: 400 16px/1.4 var(--sans); background: color-mix(in srgb, var(--folha) 70%, transparent); color: var(--tinta); }
.escrever textarea:focus { border-color: var(--sinal); outline: none; }
.escrever .bt { min-width: 48px; padding: 0 16px; }
.sugestoes { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sugestoes::-webkit-scrollbar { display: none; }
.sugestoes button { flex: none; min-height: 40px; padding: 0 14px; border: 1px solid var(--card-borda); border-radius: 999px; background: color-mix(in srgb, var(--folha) 50%, transparent); color: var(--grafite); font: 600 14px var(--sans); cursor: pointer; white-space: nowrap; }
.sugestoes button:hover { border-color: var(--sinal); color: var(--tinta); }
.conversa { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }

/* agenda e notas */
.marcar .linha-form { display: grid; grid-template-columns: 160px 120px minmax(0, 2fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }
.marcar label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.marcar input { width: 100%; min-height: 48px; padding: 0 12px; border: 1.5px solid var(--card-borda); border-radius: 14px; font: 400 16px var(--sans); background: color-mix(in srgb, var(--folha) 70%, transparent); color: var(--tinta); color-scheme: inherit; }
.marcar input:focus { border-color: var(--sinal); outline: none; }
.dia-tit { font-size: 19px; }
.linha-tempo { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.linha-tempo::before { content: ''; position: absolute; left: 46px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: linear-gradient(var(--sinal), transparent); opacity: .5; }
.ev { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 10px 0; }
.ev-hora { position: relative; z-index: 1; justify-self: start; font: 600 14px var(--mono); color: var(--menta-texto); background: var(--menta); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.ev > span:empty { display: none; }
.ev-hora.duas { display: grid; justify-items: center; line-height: 1.15; padding: 6px 10px; }
.ev-hora.duas small { font: inherit; opacity: .85; }
.ev-hora.dia-todo { background: color-mix(in srgb, var(--tinta) 10%, transparent); color: var(--grafite); }
.ev-txt { display: grid; min-width: 0; }
.ev-txt span { color: var(--grafite); font-size: 14.5px; }
/* os horários de atendimento (16/11) */
.horarios .hz-topo { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.horarios .hz-topo h2 { margin-bottom: 4px; }
.hz-editor { display: grid; gap: 14px; margin-top: 14px; }
.hz-atalhos, .hz-dur { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hz-atalhos .dica, .hz-dur > span { margin-right: 4px; }
.hz-dur > span { color: var(--grafite); font-size: 15px; }
.hz-dur .chip-f.ativo { border-color: var(--sinal); background: color-mix(in srgb, var(--teal) 16%, transparent); }
.hz-dias { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.hz-dia { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--linha) 55%, transparent); }
.hz-dia:first-child { border-top: 0; }
.hz-chave { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--grafite); font: 600 15px var(--sans); cursor: pointer; text-align: left; }
.hz-chave .gs-chave { background: color-mix(in srgb, var(--tinta) 22%, transparent); }
.hz-dia.on .hz-chave { color: var(--tinta); }
.hz-dia.on .hz-chave .gs-chave { background: var(--teal); }
.hz-dia.on .hz-chave .gs-chave i { transform: translateX(20px); }
.hz-chave:focus-visible { outline: 2px solid var(--sinal); outline-offset: 3px; border-radius: 8px; }
.hz-faixas { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.hz-faixa { display: inline-flex; align-items: center; gap: 6px; }
.hz-faixa input { min-height: 42px; padding: 6px 8px; border: 1.5px solid var(--card-borda); border-radius: 10px; font: 500 15px var(--mono); background: transparent; color: inherit; }
.hz-faixa .bt-ic { min-width: 36px; min-height: 36px; }
.hz-faixa .bt-ic svg { width: 16px; height: 16px; }
.hz-mais, .hz-copia { min-height: 36px; font-size: 14px; justify-self: start; }
.hz-fechado { font-size: 14px; }
.ev.ped { grid-template-columns: 92px minmax(0, 1fr) auto; }
.ped-bts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.ped-bts .bt.certeza { background: var(--erro-fundo); color: var(--erro); }
.selo-fora { display: inline-block; justify-self: start; margin-top: 2px; padding: 1px 8px; border-radius: 999px; font: 600 11.5px var(--mono); color: var(--tinta); background: var(--ambar-fundo); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ambar) 40%, transparent); }
.selo-fora.folga { background: color-mix(in srgb, var(--grafite) 14%, transparent); box-shadow: none; }
.ag-folga { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14.5px; color: var(--grafite); cursor: pointer; }
.ag-folga input { width: 20px; height: 20px; accent-color: var(--teal); }
@media (max-width: 760px) {
  .hz-dia { grid-template-columns: 1fr; gap: 4px; }
  .ev.ped { grid-template-columns: 78px minmax(0, 1fr); }
  .ped-bts { grid-column: 1 / -1; justify-content: stretch; } .ped-bts .bt { flex: 1; }
}
.pedido-h { border-color: color-mix(in srgb, var(--ambar) 40%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--ambar) 14%, transparent), transparent 60%), var(--card); }
.copia { display: flex; gap: 8px; }
.copia input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; border: 1.5px solid var(--card-borda); border-radius: 14px; font: 400 14px var(--mono); background: color-mix(in srgb, var(--folha) 70%, transparent); color: var(--tinta); }
.notas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.nota { display: grid; gap: 10px; padding: 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-borda); align-content: space-between; min-height: 120px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.nota label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: 16px; }
.nota input { width: 22px; height: 22px; accent-color: var(--teal); flex: none; margin-top: 2px; }
.nota.feita span.txt { text-decoration: line-through; color: var(--cinza); }
.nota .rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.compor textarea { width: 100%; min-height: 96px; resize: vertical; padding: 14px; border: 1.5px solid var(--card-borda); border-radius: 16px; font: 400 16px/1.45 var(--sans); background: color-mix(in srgb, var(--folha) 70%, transparent); color: var(--tinta); }
.compor textarea:focus { border-color: var(--sinal); outline: none; }
.compor .linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* pedidos */
.pedidos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pedido { display: grid; gap: 10px; padding: 18px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-borda); }
.pedido .topo { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.pedido b { font: 700 18px var(--serif); }
.pedido .contato { font: 500 14px var(--mono); color: var(--grafite); overflow-wrap: anywhere; }

/* arquivos e drive */
.drive { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 20px; background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, #4FB3F6 18%, transparent), transparent 60%), var(--card); }
.drive .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.medidor { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--tinta) 10%, transparent); overflow: hidden; }
.medidor i { display: block; height: 100%; background: var(--menta); border-radius: 999px; }
.medidor.alto i { background: linear-gradient(90deg, #F4C062, #E08A2E); }
/* 17/11: o saldo de respostas e os pacotes (Plano e uso) */
.saldo-grande { margin: 4px 0 10px; } .saldo-grande b { font: 700 34px var(--serif); }
.saldo-grande.acabou b { color: var(--laranja); }
.pacotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 14px 0 6px; }
.pacote { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--card-borda); border-radius: 14px; background: color-mix(in srgb, var(--teal) 5%, transparent); }
.pacote b { font-size: 17px; } .pacote .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.pacote .bt { flex: 1 1 90px; }
/* 25/11 — as três carteiras (atendimento, Dora, marketing) */
.carteiras { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0; }
.carteira { display: grid; align-content: start; gap: 4px; min-width: 0; padding: 16px; border: 1px solid var(--card-borda); border-radius: 16px; background: color-mix(in srgb, var(--teal) 4%, transparent); }
.carteira h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; font-size: 16px; }
.carteira.alto { border-color: #E9B04F; }
.carteira.acabou { border-color: var(--laranja); background: color-mix(in srgb, var(--laranja) 6%, transparent); }
.carteira.leve { opacity: .85; }
.carteira .aviso { margin: 6px 0 0; }
.carteira .carregar { margin-top: 8px; }
.carteira .carregar summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.carteira .carregar summary::-webkit-details-marker { display: none; }
.carteira .pacotes { grid-template-columns: 1fr; margin: 10px 0 0; }

/* conectar, plano, uso */
.perfil { display: flex; align-items: center; gap: 12px; }
.perfil img, .perfil .ini { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: color-mix(in srgb, var(--teal) 20%, transparent); display: grid; place-items: center; font: 700 20px var(--serif); color: var(--teal); }
.canal-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; flex: none; }
.canal-ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.canal-ic.ig { background: linear-gradient(135deg, #F7B74A, #E1306C 55%, #8A3AB9); }
.canal-ic.wa { background: linear-gradient(135deg, #3BD671, #128C4A); }
.canal-ic.dr { background: linear-gradient(135deg, #4FB3F6, #1F6FB0); }
.canal-topo { display: flex; align-items: center; gap: 14px; }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.numeros div { border: 1px solid var(--card-borda); border-radius: 18px; padding: 16px; background: color-mix(in srgb, var(--folha) 40%, transparent); }
.numeros b { display: block; font: 700 30px var(--serif); font-variant-numeric: tabular-nums; }
.numeros span { font-size: 14px; color: var(--cinza); }
.planos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.plano { border: 1.5px solid var(--card-borda); border-radius: var(--raio-g); padding: 22px; display: grid; gap: 12px; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); position: relative; overflow: hidden; }
.planos .plano { display: flex; flex-direction: column; }
.planos .plano > .botoes, .planos .plano > .dica:last-child { margin-top: auto; }
.plano.escolhido { border-color: var(--sinal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 14%, transparent); }
.plano .preco { font: 700 40px var(--serif); font-variant-numeric: tabular-nums; }
.plano .preco small { font: 400 15px var(--sans); color: var(--cinza); }
.plano ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--grafite); }
.rolagem { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--card-borda); vertical-align: top; }
th { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--cinza); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 700; border-bottom: 0; }

/* celular: menu vira gaveta + barra de baixo com 5 atalhos */
.veu { position: fixed; inset: 0; z-index: 40; background: rgba(2, 10, 11, .55); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s; }
.baixo { display: none; }
@media (max-width: 1100px) {
  .cerebro { grid-template-columns: minmax(0, 1fr); }
  .cerebro-lado { position: static; }
  .bento > *, .bento > .largo { grid-column: span 3; }
}
@media (max-width: 860px) {
  .casca { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .lado { position: fixed; z-index: 50; top: max(12px, env(safe-area-inset-top, 0px)); bottom: 12px; left: 12px; height: auto; transform: translateX(calc(-100% - 24px)); transition: transform .32s cubic-bezier(.22, 1, .36, 1); }
  .lado .gs { width: min(300px, calc(100vw - 48px)); }
  .lado .gs-recolher { display: none; }
  body.gaveta .lado { transform: none; }
  body.gaveta .veu { opacity: 1; pointer-events: auto; }
  .barra { padding: 8px 8px 8px 16px; min-height: 58px; top: max(10px, env(safe-area-inset-top, 0px)); }
  .barra .selo.robo-estado { display: none; }
  .barra-tit b { font-size: 18px; }
  .baixo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; z-index: 35; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 6px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02)), rgba(5, 22, 24, .62); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 20px 40px -16px rgba(0,0,0,.6); }
  .baixo a, .baixo button { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 56px; border-radius: 20px; color: rgba(255,255,255,.78); text-decoration: none; font: 700 12px var(--sans); background: none; border: 0; cursor: pointer; position: relative; }
  .baixo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .baixo [aria-current="page"] { color: #fff; background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.06)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .baixo [aria-current="page"] svg { color: #7DF5DC; }
  .baixo .ponto { position: absolute; top: 9px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: #F0B95A; box-shadow: 0 0 8px #F0B95A; }
  .grade, .grade3, .planos, .conversa { grid-template-columns: minmax(0, 1fr); }
  .heroi { grid-template-columns: minmax(0, 1fr); padding: 24px 20px; gap: 18px; }
  .heroi-anel { justify-self: center; order: -1; }
  .passos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bento > *, .bento > .largo { grid-column: 1 / -1; }
  .tres { grid-template-columns: minmax(0, 1fr); }
  .marcar .linha-form { grid-template-columns: 1fr 1fr; }
  .marcar .linha-form .largo, .marcar .linha-form .bt { grid-column: 1 / -1; }
  .ev { grid-template-columns: 78px minmax(0, 1fr) auto; } .ev .selo { display: none; }
  .linha-tempo::before { left: 38px; }
  .chat { height: 70vh; }
  .drive { grid-template-columns: minmax(0, 1fr); }
  .cartao { padding: 18px; }
  .solta { padding: 26px 16px 22px; }
  .cabeca-aba.com-anel { flex-wrap: nowrap; align-items: center; }
  .cabeca-aba.com-anel > div:first-child { flex: 1; }
  #cb-anel .anel { --tam: 92px !important; }
  #cb-anel .anel-txt span { letter-spacing: .06em; }
}
@media (max-width: 520px) { .numeros { grid-template-columns: minmax(0, 1fr); } .passos { grid-template-columns: minmax(0, 1fr); } .linha-campo { flex-wrap: wrap; } .linha-campo .bt { flex: 1; } }
@media (prefers-reduced-motion: reduce) { .lado, .veu { transition: none; } }
/* Arquivos: a lista e a zona de mandar lado a lado só quando há largura; senão, uma embaixo da outra */
.arq-grade { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
@media (max-width: 1100px) { .arq-grade { grid-template-columns: minmax(0, 1fr); } }
/* o aviso rápido "Aprendi: …" quando uma leitura termina (aparece onde a pessoa está, some sozinho) */
.brinde { position: fixed; right: 24px; bottom: 24px; transform: translateY(16px); opacity: 0; z-index: 60; max-width: min(460px, calc(100vw - 32px));
  display: flex; gap: 10px; align-items: flex-start; padding: 14px 18px; border-radius: 16px; font: 600 15px/1.45 var(--sans); color: var(--tinta);
  background: color-mix(in srgb, var(--folha) 96%, transparent); border: 1px solid color-mix(in srgb, var(--teal) 55%, transparent);
  box-shadow: var(--vidro-luz), 0 18px 50px -20px rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  transition: opacity .25s ease, transform .25s ease; pointer-events: none; }
.brinde.mostra { opacity: 1; transform: translateY(0); }
.brinde b { color: var(--teal); }
.brinde svg { width: 20px; height: 20px; flex: none; margin-top: 2px; fill: none; stroke: var(--teal); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 860px) { .brinde { right: 16px; left: 16px; bottom: 96px; max-width: none; } }
@media (prefers-reduced-motion: reduce) { .brinde { transition: none; } }
/* 15/11: o modo da conta */
.modos-opcoes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.modo { text-align: left; display: grid; gap: 6px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--linha); background: transparent; color: inherit; font: inherit; cursor: pointer; min-height: 44px; }
.modo b { font-size: 16px; }
.modo span { font-size: 14px; opacity: .8; line-height: 1.4; }
.modo.on { border-color: var(--teal, #19A693); background: rgba(53, 224, 191, .08); }
.modo.on b::before { content: '● '; color: var(--teal, #19A693); }
.modo:disabled { opacity: .6; cursor: progress; }
@media (max-width: 720px) { .modos-opcoes { grid-template-columns: 1fr; } }
/* 15/11: os guardados do assistente */
.guardados .pasta-nome { font-size: 15px; display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; opacity: .9; }
.guardados .pasta-nome svg { width: 18px; height: 18px; }
.guardados .fonte .dica { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
/* 15/11: o código do agente assistente e o cupom */
.codigo-dono { font: 700 40px var(--mono, ui-monospace); letter-spacing: .14em; margin: 6px 0; color: var(--tinta); }
.passinhos { margin: 4px 0 10px; padding-left: 22px; display: grid; gap: 4px; }
.cupom .linha-cupom { display: flex; gap: 8px; }
/* 16/11: a aba Conectar — dois blocos (o Sol com Instagram e WhatsApp do negócio; a Dora com o WhatsApp dela).
   Cada conexão é uma linha: ícone, nome, a situação ESCRITA numa pílula (não só cor) e uma ação principal. */
.sec-conectar { margin: 10px 2px -8px; }
.agentes-con { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.agentes-con.um { grid-template-columns: minmax(0, 1fr); }
.agente-con { gap: 16px; }
.agente-con .espaco { display: grid; gap: 6px; }
.agente-con .solta.compacta { margin: 0; }
/* o selo do topo das abas do dia a dia: quem preenche aquela aba */
.quem-faz { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 6px; justify-self: start; width: max-content; max-width: 100%; padding: 4px 14px 4px 4px; border-radius: 999px; font-size: 14px; color: var(--grafite);
  background: color-mix(in srgb, var(--folha) 70%, transparent); border: 1px solid var(--card-borda); }
.quem-faz b { font-weight: 700; }
.quem-faz b.sol, .ag-txt-sol { color: var(--teal-forte, var(--teal)); }
.quem-faz b.dora { color: color-mix(in srgb, var(--laranja) 82%, var(--tinta)); }   /* no claro, o laranja puro fica abaixo de 4,5:1 */
.mini-avs { display: inline-flex; }
.mini-av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--serif); flex: none; }
.mini-av + .mini-av { margin-left: -7px; box-shadow: 0 0 0 2px var(--papel); }
.mini-av.sol { background: linear-gradient(135deg, #3FE0C5, #138C7B); color: #04211D; }
.mini-av.dora { background: linear-gradient(135deg, #FFB06B, #E8692A); color: #fff; }
.agente-con.sol::before { background: linear-gradient(135deg, color-mix(in srgb, var(--sinal) 75%, transparent), transparent 42%, transparent 62%, color-mix(in srgb, var(--sinal) 35%, transparent)); }
.ag-topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.ag-topo h2 { margin: 0; font-size: 24px; }
.ag-topo p { margin: 2px 0 0; color: var(--grafite); font-size: 14.5px; }
.ag-av { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font: 700 24px var(--serif); color: #fff; }
.ag-av.sol { background: linear-gradient(135deg, #3FE0C5, #138C7B); color: #04211D; }
.ag-av.dora { background: linear-gradient(135deg, #FFB06B, #E8692A); }
.ag-papel { margin: 0; color: var(--grafite); font-size: 15.5px; line-height: 1.5; }
.canais-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.canal-linha { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "ic txt pill" "ic txt acao"; gap: 4px 14px; align-items: center; padding: 14px; border-radius: 18px; border: 1px solid var(--card-borda); background: color-mix(in srgb, var(--folha) 45%, transparent); }
.canal-linha .canal-ic { grid-area: ic; width: 44px; height: 44px; border-radius: 14px; align-self: start; }
.canal-linha .canal-ic svg { width: 22px; height: 22px; }
.canal-ic.dora { background: linear-gradient(135deg, #FFB06B, #E8692A); }
.canal-txt { grid-area: txt; display: grid; gap: 3px; min-width: 0; }
.canal-txt b { font-size: 16.5px; }
.canal-txt > span { color: var(--grafite); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.canal-linha .pill { grid-area: pill; justify-self: end; }
.canal-acao { grid-area: acao; justify-self: end; display: flex; gap: 8px; align-items: center; }
.canal-acao:empty { display: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font: 600 12px var(--mono); white-space: nowrap; border: 1px solid transparent; }
.pill svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; }
.pill.ok { background: color-mix(in srgb, #2FBF71 18%, transparent); color: #1E9C5A; border-color: color-mix(in srgb, #2FBF71 35%, transparent); }
.pill.nao { background: color-mix(in srgb, var(--cinza) 14%, transparent); color: var(--grafite); border-color: var(--card-borda); }
.pill.fora { background: transparent; color: var(--cinza); border-color: var(--card-borda); border-style: dashed; }
.pill.breve { background: color-mix(in srgb, var(--laranja) 14%, transparent); color: var(--laranja); border-color: color-mix(in srgb, var(--laranja) 35%, transparent); }
.pill.atencao { background: color-mix(in srgb, var(--ambar) 18%, transparent); color: var(--ambar); }
:root[data-theme="dark"] .pill.ok { color: #5BE39A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.ok { color: #5BE39A; } }
details.mais { margin-top: 4px; }
details.mais summary { cursor: pointer; color: var(--teal-forte); font-weight: 600; font-size: 14px; min-height: 32px; display: inline-flex; align-items: center; }
details.mais .botoes, details.mais .dica { margin-top: 8px; }
.canal-txt details.mais { grid-column: 1 / -1; }
.modos-dobra { padding: 0; }
.modos-dobra > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 18px 22px; min-height: 56px; font-weight: 700; }
.modos-dobra > summary b { margin-left: auto; }
.modos-dobra > summary::-webkit-details-marker { display: none; }
.modos-dobra > summary b { font: 600 13px var(--mono); padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal-forte); }
.modos-dobra > summary::after { content: '›'; font-size: 22px; color: var(--grafite); transition: transform .2s; }
.modos-dobra[open] > summary::after { transform: rotate(90deg); }
.modos-dobra > :not(summary) { padding: 0 22px 18px; }
@media (max-width: 980px) { .agentes-con { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .canal-linha { grid-template-columns: 40px minmax(0, 1fr); grid-template-areas: "ic txt" "pill pill" "acao acao"; }
  .canal-linha .canal-ic { width: 40px; height: 40px; }
  .canal-linha .pill, .canal-acao { justify-self: start; }
  .canal-acao .bt { width: 100%; justify-content: center; }
  .canal-acao { width: 100%; }
}
.cupom .linha-cupom input { flex: 1; min-width: 0; text-transform: uppercase; }

/* ===== 16/11: o plano em vigência no Conectar + o plano sugerido em destaque (um só, já com o assinar) ===== */
.plano-vig { gap: 16px; }
.pv-topo { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.pv-topo > div { flex: 1; min-width: 0; }
.pv-topo .rotulo { margin: 0 0 4px; }
.pv-topo h2 { margin: 0; font-size: 26px; }
.pv-topo h2 small { font: 500 15px var(--sans); color: var(--grafite); margin-left: 6px; white-space: nowrap; }
.pv-texto { margin: 0; color: var(--grafite); }
.pv-tem { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.pv-tem li { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; font-size: 14.5px; border: 1px solid var(--card-borda); background: color-mix(in srgb, var(--folha) 60%, transparent); }
.pv-tem li svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; flex: none; }
.pv-tem li.sim svg { color: var(--teal-forte); }
.pv-tem li.nao { color: var(--cinza); border-style: dashed; background: transparent; }
.pv-tem li.nao i { font-style: normal; font-size: 12.5px; }
.pv-acoes { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pv-modos { border-top: 1px solid var(--card-borda); padding-top: 12px; }
.pv-modos > summary b { font: 600 13px var(--mono); padding: 3px 10px; border-radius: 999px; margin-left: 6px; background: color-mix(in srgb, var(--teal) 16%, transparent); color: var(--teal-forte); }
.pv-modos .modos-opcoes { margin-top: 12px; }
.sugerido { position: relative; display: grid; gap: 12px; padding: 22px; border-radius: 22px; outline: none;
  border: 1.5px solid var(--sinal); background: linear-gradient(160deg, color-mix(in srgb, var(--sinal) 12%, transparent), color-mix(in srgb, var(--laranja) 6%, transparent) 70%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 14%, transparent), 0 22px 44px -28px color-mix(in srgb, var(--sinal) 70%, transparent);
  animation: entra .32s cubic-bezier(.2, .8, .2, 1); }
.sugerido:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--sinal) 40%, transparent); }
.selo-sug { justify-self: start; font: 700 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: var(--menta); color: var(--menta-texto); }
.sug-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sug-topo h3 { margin: 0; font: 700 28px var(--serif); }
.sug-topo .preco { margin: 0; font: 700 34px var(--serif); font-variant-numeric: tabular-nums; }
.sug-topo .preco small { font: 400 15px var(--sans); color: var(--cinza); }
.sug-porque { margin: 0; font-size: 16px; }
.sugerido ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--grafite); }
.sugerido li { display: flex; gap: 9px; align-items: flex-start; }
.sugerido li svg { width: 17px; height: 17px; margin-top: 3px; flex: none; fill: none; stroke: var(--teal-forte); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sugerido .botoes { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) { .sugerido .botoes .bt { width: 100%; justify-content: center; } .sugerido { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { .sugerido { animation: none; } }

/* ===== 15/11 à noite: o mesmo visual do site (o teste B que ele escolheu). Verde = Sol, LARANJA = Dora (não amarelo);
   vidro com um aro que vai do verde ao laranja e um brilho laranja no fundo. O aro é um ::before com máscara, para o
   cartão continuar translúcido (a borda de sempre fica por baixo). ===== */
:root { --laranja: #D9601C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --laranja: #FF8A3D; } }
:root[data-theme="dark"] { --laranja: #FF8A3D; }
.fundo::before {
  background: radial-gradient(38% 34% at 14% 10%, color-mix(in srgb, var(--teal) 36%, transparent), transparent 70%),
    radial-gradient(28% 28% at 90% 6%, color-mix(in srgb, var(--sinal) 18%, transparent), transparent 70%),
    radial-gradient(46% 42% at 80% 104%, color-mix(in srgb, var(--laranja) 24%, transparent), transparent 70%); }
.cartao { position: relative; }
.cartao::before, .plano::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, color-mix(in srgb, var(--sinal) 55%, transparent), transparent 38%, transparent 62%, color-mix(in srgb, var(--laranja) 50%, transparent));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
/* o que é da Dora fica laranja: o cartão da secretária, o plano Secretária e o quadro dos avisos */
.da-dora::before { background: linear-gradient(135deg, color-mix(in srgb, var(--laranja) 75%, transparent), transparent 42%, transparent 60%, color-mix(in srgb, var(--laranja) 45%, transparent)); }
.da-dora .canal-ic { background: linear-gradient(135deg, #FFB06B, #E8692A); }
.da-dora h2 .ic, .da-dora > h2 svg { color: var(--laranja); }
.da-dora .bt:not(.fraco) { background: linear-gradient(180deg, #FFB06B, #F2772F); color: #2A1004; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 12px 26px -14px rgba(255,138,61,.7); }
.da-dora .bt.fraco:hover { border-color: color-mix(in srgb, var(--laranja) 55%, transparent); background: color-mix(in srgb, var(--laranja) 12%, transparent); }
.plano.da-dora.escolhido { border-color: var(--laranja); box-shadow: 0 0 0 4px color-mix(in srgb, var(--laranja) 14%, transparent); }
.avisos-dora { border-color: color-mix(in srgb, var(--laranja) 35%, var(--card-borda)); background: color-mix(in srgb, var(--laranja) 6%, transparent); }
.av-linha input[type=checkbox] { accent-color: var(--laranja); }

/* ===== o CRM: aba Clientes (15/11 à noite). As etapas têm cor: novo = laranja (precisa de resposta), conversando =
   verde-água, fechado = verde, perdido = cinza. A ficha abre num painel ao lado; no celular, a tela inteira. ===== */
.sit { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 600 11.5px var(--mono); letter-spacing: .04em; white-space: nowrap; }
.sit-novo { background: color-mix(in srgb, var(--laranja) 18%, transparent); color: var(--laranja); }
.sit-conversando { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal-forte); }
.sit-fechado { background: color-mix(in srgb, #2FBF71 20%, transparent); color: #1E9C5A; }
.sit-perdido { background: color-mix(in srgb, var(--cinza) 18%, transparent); color: var(--cinza); }
:root[data-theme="dark"] .sit-fechado { color: #5BE39A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sit-fechado { color: #5BE39A; } }
.crm-numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.crm-numeros > div { background: var(--card); border: 1px solid var(--card-borda); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; }
.crm-numeros b { font: 700 28px var(--serif); }
.crm-numeros span { color: var(--grafite); font-size: 14px; }
.crm-numeros > div:first-child b { color: var(--laranja); }
.crm-barra { display: grid; gap: 12px; }
.chips-f { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-f { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--card-borda); background: color-mix(in srgb, var(--folha) 40%, transparent); color: var(--tinta); font: 600 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip-f .num { color: var(--grafite); font-weight: 400; }
.chip-f.ativo { border-color: var(--sinal); background: color-mix(in srgb, var(--teal) 16%, transparent); }
.chip-f.quente:not(.ativo) { border-color: color-mix(in srgb, var(--laranja) 55%, transparent); }
.crm-busca { display: flex; gap: 10px; align-items: center; }
.crm-busca input { flex: 1; min-width: 0; min-height: 46px; padding: 10px 14px; border: 1.5px solid var(--card-borda); border-radius: 14px; font: 400 16px var(--sans); background: var(--card); color: var(--tinta); }
.vista { display: inline-flex; border: 1px solid var(--card-borda); border-radius: 999px; padding: 3px; background: var(--card); }
.vista button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--grafite); font: 600 14px var(--sans); cursor: pointer; }
.vista button[aria-pressed="true"] { background: var(--menta); color: var(--menta-texto); }
.cl-lista { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.cliente { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; cursor: pointer; }
.cliente:hover, .cliente:focus-visible { background: color-mix(in srgb, var(--teal) 9%, transparent); outline: none; }
.avatar-cl { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--sans); color: #fff; background: linear-gradient(135deg, var(--teal), color-mix(in srgb, var(--laranja) 70%, var(--teal))); flex: none; }
.avatar-cl.grande { width: 52px; height: 52px; font-size: 18px; }
.cl-txt { display: grid; gap: 2px; min-width: 0; }
.cl-txt b { font: 700 16.5px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-txt .dica { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl-prox { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--teal-forte); }
.cl-prox .ic svg { width: 15px; height: 15px; }
.cl-lado { display: grid; justify-items: end; gap: 4px; }
.selo-precisa { padding: 2px 9px; border-radius: 999px; font: 600 11px var(--mono); background: var(--laranja); color: #fff; }
/* 17/11: "você assumiu" — o Sol está quieto com essa pessoa (ficha › Conversa) */
.selo-assumido { padding: 2px 9px; border-radius: 999px; font: 600 11px var(--mono); color: var(--teal-forte, var(--teal));
  background: color-mix(in srgb, var(--teal) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 40%, transparent); }
.conversa-bloco p { margin: 0; }
.conversa-bloco .botoes { display: flex; flex-wrap: wrap; gap: 8px; }
.conversa-bloco.assumido { padding: 14px; border: 1.5px solid color-mix(in srgb, var(--teal) 55%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--teal) 8%, transparent); }
/* o cliente que veio da conversa do Testar (16/11) */
.selo-teste { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font: 600 11px var(--mono); letter-spacing: .02em;
  color: var(--grafite); background: color-mix(in srgb, var(--grafite) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--grafite) 28%, transparent); }
.aviso-teste { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; color: var(--grafite);
  background: color-mix(in srgb, var(--grafite) 9%, transparent); }
.aviso-teste > .ic { flex: none; margin-top: 1px; } .aviso-teste > .ic svg { width: 18px; height: 18px; }
.aviso-teste p { margin: 0 0 8px; }
/* apagar o cliente de teste direto na lista (16/11: "deixe habilitado se a pessoa quiser apagar depois") */
.cl-apaga { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--card-borda);
  background: transparent; color: var(--grafite); font: 600 12.5px var(--sans); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
.cl-apaga svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cl-apaga:hover, .cl-apaga:focus-visible, .cl-apaga.certeza { background: var(--erro-fundo); color: var(--erro); border-color: color-mix(in srgb, var(--erro) 40%, transparent); outline: none; }
.cl-apaga:focus-visible { box-shadow: 0 0 0 2px var(--erro); }
.cl-apaga:disabled { opacity: .55; cursor: wait; }
.cliente.compacto .cl-apaga:not(.certeza) span { display: none; }
.cliente.compacto .cl-apaga { min-height: 30px; padding: 0 8px; }
.faixa-teste { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin: 0 0 12px; padding: 10px 12px 10px 14px; border-radius: 14px; font-size: 14px;
  color: var(--grafite); background: color-mix(in srgb, var(--grafite) 9%, transparent); }
.faixa-teste > .ic { flex: none; } .faixa-teste > .ic svg { width: 18px; height: 18px; }
.faixa-teste .ft-txt { flex: 1 1 260px; }
.faixa-teste .bt.certeza { background: var(--erro-fundo); color: var(--erro); }
@media (max-width: 760px) { .cl-apaga { min-height: 40px; } }
.vazio-crm { gap: 12px; }
/* o funil: 4 colunas; no celular rolam de lado */
.funil { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.coluna { background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px dashed var(--card-borda); border-radius: 20px; padding: 10px; min-height: 220px; display: grid; align-content: start; gap: 8px; transition: border-color .15s, background .15s; }
.coluna h3 { margin: 4px 6px; display: flex; justify-content: space-between; align-items: center; font: 600 14px var(--sans); }
.coluna.alvo { border-color: var(--laranja); background: color-mix(in srgb, var(--laranja) 8%, transparent); }
.coluna .cl-lista { padding: 0; gap: 8px; }
.cliente.compacto { grid-template-columns: 34px minmax(0, 1fr); background: var(--card); border: 1px solid var(--card-borda); padding: 10px; cursor: grab; }
.cliente.compacto .avatar-cl { width: 34px; height: 34px; font-size: 13px; }
.cliente.compacto .cl-lado { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; justify-content: space-between; align-items: center; }
.cliente.arrastando { opacity: .5; }
.coluna-vazia { padding: 18px 8px; text-align: center; }
/* a ficha */
.ficha-fundo { position: fixed; inset: 0; z-index: 190; background: rgba(4, 10, 12, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.ficha { position: fixed; z-index: 191; top: 12px; right: 12px; bottom: 12px; width: min(480px, calc(100vw - 24px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--folha); display: grid; align-content: start; gap: 16px; animation: entraFicha .26s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes entraFicha { from { transform: translateX(24px); } }
.ficha-topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ficha-topo h2 { grid-column: 1 / 3; }
.ficha-nome { font: 700 22px var(--serif); border: 1.5px solid transparent; border-radius: 12px; padding: 6px 8px; background: transparent; color: var(--tinta); min-width: 0; }
.ficha-nome:hover, .ficha-nome:focus { border-color: var(--card-borda); outline: none; }
.segmento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seg { min-height: 42px; border-radius: 12px; border: 1.5px solid var(--card-borda); background: transparent; color: var(--grafite); font: 600 14px var(--sans); cursor: pointer; }
.seg.ativo.sit-novo { border-color: var(--laranja); color: var(--laranja); background: color-mix(in srgb, var(--laranja) 12%, transparent); }
.seg.ativo.sit-conversando { border-color: var(--teal); color: var(--teal-forte); background: color-mix(in srgb, var(--teal) 12%, transparent); }
.seg.ativo.sit-fechado { border-color: #2FBF71; color: #1E9C5A; background: color-mix(in srgb, #2FBF71 14%, transparent); }
.seg.ativo.sit-perdido { border-color: var(--cinza); color: var(--tinta); background: color-mix(in srgb, var(--cinza) 14%, transparent); }
.seg:not(.ativo) { background: transparent !important; }
.ficha-bloco { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--card-borda); }
.ficha-bloco h3 { display: flex; gap: 8px; align-items: center; font-size: 16px; margin: 0; }
.contatos .ct { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.contatos .ct b { overflow-wrap: anywhere; font: 500 15px var(--mono); }
.editar-ct summary { cursor: pointer; color: var(--teal-forte); font-weight: 600; font-size: 14.5px; }
.proximo.tem { background: color-mix(in srgb, var(--laranja) 7%, transparent); border-radius: 16px; padding: 14px; border-top: 0; }
.prox-atual { display: grid; gap: 2px; margin: 0; }
.prox-atual b { font-size: 17px; }
.atalhos { display: flex; flex-wrap: wrap; gap: 6px; }
.atalhos .chip-f { min-height: 32px; font-size: 13px; }
.historico { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.historico li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.historico li > div { display: grid; gap: 2px; }
.historico .ic { color: var(--teal-forte); margin-top: 2px; }
.ficha-pe { display: flex; justify-content: flex-end; }
.ficha-form { display: grid; gap: 12px; }
.ficha .linha-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.ficha .linha-form label { display: grid; gap: 5px; font-weight: 700; font-size: 14px; }
.ficha .linha-form .largo, .ficha .linha-form .bt { grid-column: 1 / -1; }
/* 27/11 — a ficha completa: títulos das partes do cadastro, o estado (select) e o bloco de notas */
.ficha .form-sec { display: flex; gap: 8px; align-items: center; font-size: 15px; margin: 8px 0 0; padding-top: 14px; border-top: 1px solid var(--card-borda); }
.ficha .form-pes { display: grid; gap: 12px; padding-top: 10px; }
.ficha .form-pes .form-sec { border-top: 0; padding-top: 0; margin-top: 2px; }
.ficha .linha-form select { width: 100%; min-height: 44px; padding: 9px 12px; border: 1.5px solid var(--card-borda); border-radius: 12px; background: color-mix(in srgb, var(--folha) 50%, transparent); color: var(--tinta); font: 400 16px var(--sans); }
.ficha .linha-form select:focus { border-color: var(--sinal); outline: none; }
.ficha-form .linha-form input { min-height: 48px; }
.ficha textarea { resize: vertical; }
/* 27/11 — a Assinatura (mensalidade por Pix do cliente implantado): situação, valor, meses e o QR code */
.assinatura .cartao { display: grid; gap: 12px; }
.as-pill { justify-self: start; display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 15px; border: 1px solid var(--card-borda); }
.as-pill i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.as-pill small { font-weight: 400; color: var(--grafite); }
.as-pill.as-verde { color: var(--teal-forte); } .as-pill.as-azul { color: #6FB6F0; } .as-pill.as-ambar { color: #F0B95A; } .as-pill.as-verm { color: var(--erro); background: var(--erro-fundo); } .as-pill.as-cinza { color: var(--grafite); }
.as-valor { font: 700 44px/1 var(--serif); margin: 0; }
.as-valor small { font: 400 16px var(--sans); color: var(--grafite); }
.as-valor s { font: 400 20px var(--sans); color: var(--grafite); text-decoration-thickness: 1.5px; margin-right: 4px; }
.as-linhas { display: grid; gap: 6px; margin: 0; }
.as-linhas > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; }
.as-linhas dt { color: var(--grafite); font-size: 14.5px; } .as-linhas dd { margin: 0; font-weight: 600; }
.as-meses { display: flex; flex-wrap: wrap; gap: 8px; }
.as-mes { display: grid; justify-items: center; min-width: 58px; padding: 7px 8px; border-radius: 12px; border: 1px solid var(--card-borda); font: 700 13px var(--mono); text-transform: uppercase; }
.as-mes small { font: 400 11px var(--sans); text-transform: none; color: var(--grafite); }
.as-mes.ok { border-color: var(--sinal); color: var(--teal-forte); } .as-mes.atr { border-color: var(--erro); color: var(--erro); } .as-mes.avisado { border-color: #6FB6F0; color: #6FB6F0; } .as-mes.prox { border-color: #F0B95A; }
.as-pagar h2 { display: flex; gap: 8px; align-items: center; margin: 0; }
.as-det > summary { cursor: pointer; list-style: none; justify-self: start; display: inline-flex; } .as-det > summary::-webkit-details-marker { display: none; }
.as-pix { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; padding-top: 14px; }
.as-qr { background: #fff; border-radius: 14px; padding: 6px; line-height: 0; } .as-qr canvas { display: block; width: 220px; height: 220px; }
.as-pix-tx { display: grid; gap: 10px; }
.as-pix-tx textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--card-borda); border-radius: 12px; background: color-mix(in srgb, var(--folha) 50%, transparent); color: var(--tinta); font: 400 12.5px/1.4 var(--mono); resize: none; overflow-wrap: anywhere; }
.as-ja { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-top: 12px; border-top: 1px solid var(--card-borda); }
@media (max-width: 860px) { .as-pix { grid-template-columns: 1fr; justify-items: center; } .as-pix-tx { justify-self: stretch; } .as-valor { font-size: 36px; } }
/* 27/11 — lembretes e boletos: a lista de avisos, os boletos de cada cliente e as contas a pagar */
.lem-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lem-lista > li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--card-borda); }
.lem-lista > li:first-child { border-top: 0; }
.lem-lista > li.bol { grid-template-columns: minmax(0, 1fr) auto auto; }
.lem-lista > li > .ic { color: var(--teal-forte); }
.lem-lista > li.atrasado > .ic { color: var(--laranja); }
.lem-txt { display: grid; gap: 2px; min-width: 0; }
.lem-txt b { font-weight: 700; overflow-wrap: anywhere; }
.lem-txt .linha-dig { font: 400 12.5px var(--mono); overflow-wrap: anywhere; }
.lem-lista .botoes { margin: 0; flex-wrap: nowrap; gap: 6px; }
.selo-bol { padding: 3px 10px; border-radius: 999px; font: 600 11.5px var(--mono); white-space: nowrap; border: 1px solid var(--card-borda); color: var(--grafite); }
.selo-bol.atrasado { background: var(--laranja); border-color: var(--laranja); color: #fff; }
.selo-bol.hoje { background: color-mix(in srgb, var(--teal) 22%, transparent); border-color: var(--sinal); color: var(--tinta); }
.selo-bol.pago { color: var(--teal-forte); }
.lem-lista.na-ficha > li.bol { grid-template-columns: minmax(0, 1fr) auto; }
.lem-lista.na-ficha > li.bol .botoes { grid-column: 1 / -1; flex-wrap: wrap; }
.lembretes .cartao { display: grid; gap: 10px; }
.lembretes .dia-tit { display: flex; gap: 8px; align-items: center; margin: 0; }
